<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas2D</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section id="left">
            <ul id="tools" class="toolbar">
                <li><button class="tool-btn" id="draw-btn"></button></li>
                <li><button class="tool-btn" id="erase-btn"></button></li>
                <li><button class="tool-btn" id="stamp-btn"></button></li>
            </ul>
            <ul id="actions" class="toolbar">
                <li><button class="tool-btn" id="undo-btn"></button></li>
                <li><button class="tool-btn" id="clear-btn"></button></li>
            </ul>
        </section>
        <section id="right">
            <div id="params">
                <input type="range" id="brush-size" min="1" max="100" value="20">
                <input type="color" id="brush-color">
            </div>
            <canvas id="paint-canvas"></canvas>
        </section>
    </main>
</body>
</html>

<script src="script/main.js"></script>
